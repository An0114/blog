# 生产部署：db + backend + frontend(nginx)，一条命令启动
#   docker compose up -d --build
# 环境变量来自根目录 .env（模板 .env.example）；JWT 密钥缺失时启动即报错。

name: blog

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 不对外暴露 5432，仅后端容器内网访问

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # 连接串指向 compose 服务名 db（内网），账号密码与 POSTGRES_* 保持一致
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blog}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 设置 JWT_SECRET_KEY（openssl rand -hex 32）}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-blog@example.com}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      EMAIL_TOKEN_EXPIRE_MINUTES: ${EMAIL_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      # 上传媒体 + 站点图标持久化（重启/升级不丢）
      - blog_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  blog_pgdata:
  blog_uploads:
