# 前端 Nginx：静态托管 SPA + 反代 /api、/uploads 到后端服务（compose 服务名 backend，不写死 IP）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 视频上传上限 100MB（后端白名单同为 100MB；nginx 默认 1m 会 413）
    client_max_body_size 100m;

    # 无副作用安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 路由回退：刷新 /login、/about 等前端路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（保留原路径前缀 /api/...）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传媒体静态代理（图片/视频/站点图标，保留 /uploads/... 前缀）
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
